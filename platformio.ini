[platformio]
default_envs = nano_every

[env]
build_flags = -Iinclude -std=gnu++17
build_unflags = -std=gnu++11 -std=gnu++14

[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.36.18
build_flags =
    ${env.build_flags}
    -fno-sized-deallocation
build_src_filter =
    +<*>
    -<ui_demo.cpp>
    -<eeprom_demo.cpp>
    -<bringup.cpp>
    -<ops_demo.cpp>
    -<i2c_probe.cpp>

; Hardware demo for the control board (OLED, encoder, Mode/Back buttons); prints to serial.
[env:ui_demo]
extends = env:nano_every
build_src_filter =
    +<*>
    -<main.cpp>
    -<eeprom_demo.cpp>
    -<bringup.cpp>
    -<ops_demo.cpp>
    -<i2c_probe.cpp>

; Serial test sketch for preset-management on the real EEPROM; see the comment in eeprom_demo.cpp.
[env:eeprom_demo]
extends = env:nano_every
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui_demo.cpp>
    -<bringup.cpp>
    -<ops_demo.cpp>
    -<i2c_probe.cpp>

; Serial bring-up sketch for the audio PCB's relays; see the comment in bringup.cpp.
[env:bringup]
extends = env:nano_every
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui_demo.cpp>
    -<eeprom_demo.cpp>
    -<ops_demo.cpp>
    -<i2c_probe.cpp>

; The finished UI on the control board alone, with simulated relays, LEDs and footswitches;
; see the comment in ops_demo.cpp.
[env:ops_demo]
extends = env:nano_every
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui_demo.cpp>
    -<eeprom_demo.cpp>
    -<bringup.cpp>
    -<i2c_probe.cpp>

; Live I2C scan plus a footswitch and LED tester for the audio PCB's U2; see i2c_probe.cpp.
[env:i2c_probe]
extends = env:nano_every
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui_demo.cpp>
    -<eeprom_demo.cpp>
    -<bringup.cpp>
    -<ops_demo.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    ${env.build_flags}
    -Itest/support
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui_demo.cpp>
    -<eeprom_demo.cpp>
    -<bringup.cpp>
    -<ops_demo.cpp>
    -<i2c_probe.cpp>
    -<ui_framework/arduino_input.cpp>
    -<ui_framework/u8g2_display.cpp>
